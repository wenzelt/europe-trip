<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Unser Europa-Roadtrip mit dem Auto – Orte, Geschichten und Pläne auf einer interaktiven Karte.">
  <title>Europa Roadtrip Journal</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #17352f;
      --muted: #6c7c76;
      --paper: #f7f3eb;
      --card: #fffdf8;
      --line: #ded8cc;
      --green: #215f50;
      --green-soft: #d9e9df;
      --terracotta: #c86445;
      --sun: #e8b44f;
      --shadow: 0 18px 50px rgba(27, 52, 45, .11);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { color: inherit; }

    .site-header {
      min-height: 210px;
      padding: 36px clamp(20px, 5vw, 72px) 32px;
      color: #fff;
      background:
        radial-gradient(circle at 80% 20%, rgba(232,180,79,.35), transparent 28%),
        linear-gradient(125deg, #163f36, #26705d 58%, #3f816f);
      position: relative;
      overflow: hidden;
    }
    .site-header::after {
      content: "";
      position: absolute;
      inset: auto -5% -54px;
      height: 100px;
      background: var(--paper);
      transform: rotate(-2deg);
      transform-origin: left;
    }
    .header-inner { position: relative; z-index: 1; max-width: 1300px; margin: 0 auto; }
    .eyebrow {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      margin: 0 0 14px;
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: #d9eadf;
    }
    h1 {
      margin: 0;
      max-width: 780px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.35rem, 5.4vw, 5rem);
      font-weight: 500;
      line-height: .98;
      letter-spacing: -.045em;
    }
    .subtitle { max-width: 660px; margin: 18px 0 0; color: #deebe6; font-size: clamp(.95rem, 1.5vw, 1.12rem); line-height: 1.55; }

    .layout {
      display: grid;
      grid-template-columns: minmax(340px, 480px) minmax(420px, 1fr);
      gap: 22px;
      max-width: 1440px;
      margin: 0 auto;
      padding: 16px clamp(16px, 3vw, 44px) 44px;
    }
    .journal { min-width: 0; }
    .map-shell {
      position: sticky;
      top: 18px;
      height: calc(100vh - 36px);
      min-height: 560px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      background: #d7ddd6;
    }
    #map { width: 100%; height: 100%; }
    .map-title {
      position: absolute;
      z-index: 500;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }
    .map-badge {
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 999px;
      background: rgba(255,253,248,.92);
      box-shadow: 0 6px 22px rgba(23,53,47,.14);
      backdrop-filter: blur(10px);
      color: var(--green);
      font-size: .78rem;
      font-weight: 800;
    }

    .toolbar {
      margin-bottom: 16px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,253,248,.74);
    }
    .search {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: var(--ink);
    }
    .search:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(33,95,80,.12); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .filter {
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      font-size: .78rem;
      font-weight: 700;
    }
    .filter:hover, .filter[aria-pressed="true"] { border-color: var(--green); background: var(--green); color: #fff; }

    .summary-row { display: flex; gap: 10px; margin: 0 0 16px; }
    .summary-item {
      flex: 1;
      padding: 13px 14px;
      border-left: 3px solid var(--terracotta);
      background: rgba(255,255,255,.5);
    }
    .summary-value { display: block; font-family: Georgia, serif; font-size: 1.35rem; }
    .summary-label { color: var(--muted); font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }

    .entry-list { display: grid; gap: 14px; }
    .entry-card {
      width: 100%;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 8px 28px rgba(23,53,47,.06);
      text-align: left;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .entry-card:hover, .entry-card:focus-visible { transform: translateY(-2px); border-color: #b8c7c0; box-shadow: var(--shadow); outline: none; }
    .card-image { display: block; width: 100%; aspect-ratio: 16/8; object-fit: cover; background: #dce6df; }
    .card-body { padding: 18px; }
    .card-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; color: var(--muted); font-size: .74rem; font-weight: 700; }
    .status { padding: 4px 8px; border-radius: 999px; background: var(--green-soft); color: var(--green); text-transform: capitalize; }
    .status-unterwegs { background: #fff0cc; color: #79530b; }
    .status-besucht { background: #e3e8f5; color: #384d83; }
    .status-idee { background: #f0e6f4; color: #71477e; }
    .card-title { margin: 0 0 9px; font-family: Georgia, serif; font-size: 1.5rem; font-weight: 600; line-height: 1.14; }
    .card-summary { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.55; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 15px; color: var(--green); font-size: .78rem; font-weight: 800; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { color: var(--muted); font-size: .7rem; font-weight: 650; }

    .empty, .error {
      padding: 28px;
      border: 1px dashed var(--line);
      border-radius: 18px;
      color: var(--muted);
      text-align: center;
    }
    .error { border-color: #d7a497; background: #fff6f3; color: #7e3927; }

    dialog {
      width: min(720px, calc(100vw - 28px));
      max-height: calc(100vh - 28px);
      padding: 0;
      overflow: auto;
      border: 0;
      border-radius: 24px;
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 30px 90px rgba(12,36,30,.35);
    }
    dialog::backdrop { background: rgba(11,35,29,.6); backdrop-filter: blur(5px); }
    .dialog-close {
      position: sticky;
      z-index: 2;
      top: 14px;
      float: right;
      margin: 14px 14px -58px 0;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 50%;
      background: rgba(255,253,248,.94);
      cursor: pointer;
      font-size: 1.25rem;
    }
    .article-cover { display: block; width: 100%; max-height: 390px; object-fit: cover; background: var(--green-soft); }
    .article { padding: clamp(24px, 5vw, 52px); }
    .article h2 { margin: 8px 0 16px; font-family: Georgia, serif; font-size: clamp(2rem, 5vw, 3.7rem); font-weight: 500; line-height: 1.03; letter-spacing: -.035em; }
    .article-location { color: var(--terracotta); font-weight: 800; }
    .article p { color: #445b54; line-height: 1.75; }
    .article h3 { margin-top: 30px; font-family: Georgia, serif; font-size: 1.25rem; }
    .article ul { padding-left: 20px; color: #445b54; line-height: 1.7; }
    .article-links { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 26px; }
    .article-links a { padding: 9px 12px; border-radius: 10px; background: var(--green-soft); color: var(--green); font-weight: 750; text-decoration: none; }
    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 24px; }
    .gallery img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 12px; }

    .route-marker {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 3px solid #fff;
      border-radius: 50% 50% 50% 10%;
      transform: rotate(-45deg);
      background: var(--terracotta);
      box-shadow: 0 6px 16px rgba(23,53,47,.28);
      color: #fff;
      font-weight: 900;
    }
    .route-marker span { transform: rotate(45deg); font-size: .72rem; }
    .leaflet-popup-content-wrapper { border-radius: 14px; box-shadow: var(--shadow); }
    .popup-title { display: block; margin-bottom: 4px; color: var(--ink); font-weight: 850; }
    .popup-meta { color: var(--muted); font-size: .75rem; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .map-shell { position: relative; top: auto; grid-row: 1; height: 55vh; min-height: 420px; }
      .journal { grid-row: 2; }
    }
    @media (max-width: 520px) {
      .site-header { min-height: 190px; padding-top: 26px; }
      .layout { padding-inline: 10px; }
      .map-shell { height: 48vh; min-height: 350px; border-radius: 18px; }
      .summary-row { gap: 4px; }
      .summary-item { padding-inline: 10px; }
      .gallery { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <p class="eyebrow">🚗 Auto · 🏡 Airbnbs · 📍 Europa</p>
      <h1 id="trip-title">Europa Roadtrip Journal</h1>
      <p class="subtitle" id="trip-subtitle">Orte, Geschichten und Pläne auf einer interaktiven Karte.</p>
    </div>
  </header>

  <main class="layout">
    <section class="journal" aria-label="Reisetagebuch">
      <div class="toolbar">
        <label for="search" class="eyebrow" style="color:var(--green); margin-bottom:9px">Journal durchsuchen</label>
        <input class="search" id="search" type="search" placeholder="Ort, Land, Tag oder Text …" autocomplete="off">
        <div class="filters" id="filters" aria-label="Nach Status filtern">
          <button class="filter" type="button" data-filter="alle" aria-pressed="true">Alle</button>
          <button class="filter" type="button" data-filter="idee" aria-pressed="false">Ideen</button>
          <button class="filter" type="button" data-filter="geplant" aria-pressed="false">Geplant</button>
          <button class="filter" type="button" data-filter="unterwegs" aria-pressed="false">Unterwegs</button>
          <button class="filter" type="button" data-filter="besucht" aria-pressed="false">Besucht</button>
        </div>
      </div>

      <div class="summary-row" aria-label="Reisestatistik">
        <div class="summary-item"><strong class="summary-value" id="place-count">–</strong><span class="summary-label">Orte</span></div>
        <div class="summary-item"><strong class="summary-value" id="country-count">–</strong><span class="summary-label">Länder</span></div>
        <div class="summary-item"><strong class="summary-value" id="entry-count">–</strong><span class="summary-label">Einträge</span></div>
      </div>

      <div class="entry-list" id="entry-list" aria-live="polite">
        <p class="empty">Einträge werden geladen …</p>
      </div>
    </section>

    <aside class="map-shell" aria-label="Interaktive Karte der Reise">
      <div class="map-title"><span class="map-badge" id="map-badge">Route & Orte</span></div>
      <div id="map"></div>
    </aside>
  </main>

  <dialog id="entry-dialog" aria-labelledby="article-title">
    <button class="dialog-close" id="dialog-close" type="button" aria-label="Artikel schließen">×</button>
    <div id="article-content"></div>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const state = { data: null, entries: [], filter: 'alle', query: '', markers: new Map() };
    const statusLabels = { idee: 'Idee', geplant: 'Geplant', unterwegs: 'Unterwegs', besucht: 'Besucht' };
    const dateFormatter = new Intl.DateTimeFormat('de-DE', { day: '2-digit', month: 'long', year: 'numeric' });

    const map = L.map('map', { zoomControl: false, scrollWheelZoom: true }).setView([47, 10], 5);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_2htp_1_41c93b5f35f255820048b038', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    const markerLayer = L.layerGroup().addTo(map);
    let routeLine = null;

    function formatDate(value) {
      const date = new Date(`${value}T12:00:00`);
      return Number.isNaN(date.valueOf()) ? value : dateFormatter.format(date);
    }

    function markerIcon(order) {
      return L.divIcon({
        className: '',
        html: `<div class="route-marker"><span>${order}</span></div>`,
        iconSize: [34, 34],
        iconAnchor: [17, 30],
        popupAnchor: [0, -30]
      });
    }

    function searchableText(entry) {
      return [entry.title, entry.summary, entry.location.name, entry.location.region, entry.location.country, ...(entry.tags || []), ...(entry.body || [])]
        .filter(Boolean).join(' ').toLocaleLowerCase('de-DE');
    }

    function visibleEntries() {
      return state.entries.filter(entry => {
        const statusMatch = state.filter === 'alle' || entry.status === state.filter;
        const queryMatch = !state.query || searchableText(entry).includes(state.query);
        return statusMatch && queryMatch;
      });
    }

    function createCard(entry) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'entry-card';
      card.setAttribute('aria-label', `${entry.title} in ${entry.location.name} öffnen`);

      if (entry.cover_image) {
        const image = document.createElement('img');
        image.className = 'card-image';
        image.src = entry.cover_image;
        image.alt = `${entry.location.name} – Titelbild`;
        image.loading = 'lazy';
        card.append(image);
      }

      const body = document.createElement('div');
      body.className = 'card-body';

      const meta = document.createElement('div');
      meta.className = 'card-meta';
      const status = document.createElement('span');
      status.className = `status status-${entry.status}`;
      status.textContent = statusLabels[entry.status] || entry.status;
      const where = document.createElement('span');
      where.textContent = `${entry.location.name}, ${entry.location.country}`;
      const date = document.createElement('time');
      date.dateTime = entry.date;
      date.textContent = formatDate(entry.date);
      meta.append(status, where, date);

      const title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = entry.title;
      const summary = document.createElement('p');
      summary.className = 'card-summary';
      summary.textContent = entry.summary;

      const footer = document.createElement('div');
      footer.className = 'card-footer';
      const tags = document.createElement('span');
      tags.className = 'tags';
      for (const tag of (entry.tags || []).slice(0, 3)) {
        const item = document.createElement('span');
        item.className = 'tag';
        item.textContent = `#${tag}`;
        tags.append(item);
      }
      const read = document.createElement('span');
      read.textContent = 'Lesen →';
      footer.append(tags, read);
      body.append(meta, title, summary, footer);
      card.append(body);

      card.addEventListener('click', () => openEntry(entry));
      card.addEventListener('mouseenter', () => state.markers.get(entry.id)?.openPopup());
      return card;
    }

    function render() {
      const entries = visibleEntries();
      const list = document.getElementById('entry-list');
      list.replaceChildren();
      if (!entries.length) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'Keine passenden Einträge gefunden.';
        list.append(empty);
      } else {
        for (const entry of entries) list.append(createCard(entry));
      }

      const uniquePlaces = new Set(entries.map(entry => `${entry.location.lat},${entry.location.lng}`));
      const uniqueCountries = new Set(entries.map(entry => entry.location.country_code));
      document.getElementById('place-count').textContent = uniquePlaces.size;
      document.getElementById('country-count').textContent = uniqueCountries.size;
      document.getElementById('entry-count').textContent = entries.length;
      document.getElementById('map-badge').textContent = `${entries.length} ${entries.length === 1 ? 'Eintrag' : 'Einträge'} auf der Karte`;
      renderMap(entries);
    }

    function renderMap(entries) {
      markerLayer.clearLayers();
      state.markers.clear();
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }

      const sorted = [...entries].sort((a, b) => a.route_order - b.route_order);
      const coordinates = [];
      for (const entry of sorted) {
        const { lat, lng } = entry.location;
        coordinates.push([lat, lng]);
        const popup = document.createElement('div');
        const title = document.createElement('button');
        title.type = 'button';
        title.className = 'popup-title';
        title.style.cssText = 'border:0;background:none;padding:0;cursor:pointer;text-align:left';
        title.textContent = entry.title;
        title.addEventListener('click', () => openEntry(entry));
        const meta = document.createElement('span');
        meta.className = 'popup-meta';
        meta.textContent = `${entry.location.name} · ${formatDate(entry.date)}`;
        popup.append(title, meta);

        const marker = L.marker([lat, lng], { icon: markerIcon(entry.route_order), title: entry.title })
          .bindPopup(popup)
          .addTo(markerLayer);
        marker.on('click', () => marker.openPopup());
        state.markers.set(entry.id, marker);
      }

      if (coordinates.length > 1) {
        routeLine = L.polyline(coordinates, { color: '#c86445', weight: 4, opacity: .78, dashArray: '2 10', lineCap: 'round' }).addTo(map);
      }
      if (coordinates.length === 1) map.setView(coordinates[0], 9, { animate: true });
      if (coordinates.length > 1) map.fitBounds(coordinates, { padding: [55, 55], maxZoom: 9 });
    }

    function openEntry(entry) {
      const dialog = document.getElementById('entry-dialog');
      const root = document.getElementById('article-content');
      root.replaceChildren();

      if (entry.cover_image) {
        const cover = document.createElement('img');
        cover.className = 'article-cover';
        cover.src = entry.cover_image;
        cover.alt = `${entry.location.name} – Titelbild`;
        root.append(cover);
      }

      const article = document.createElement('article');
      article.className = 'article';
      const meta = document.createElement('div');
      meta.className = 'card-meta';
      const status = document.createElement('span');
      status.className = `status status-${entry.status}`;
      status.textContent = statusLabels[entry.status] || entry.status;
      const date = document.createElement('time');
      date.dateTime = entry.date;
      date.textContent = formatDate(entry.date);
      meta.append(status, date);

      const location = document.createElement('div');
      location.className = 'article-location';
      location.textContent = `📍 ${entry.location.name}${entry.location.region ? `, ${entry.location.region}` : ''} · ${entry.location.country}`;
      const title = document.createElement('h2');
      title.id = 'article-title';
      title.textContent = entry.title;
      article.append(meta, location, title);

      for (const paragraphText of entry.body || []) {
        const paragraph = document.createElement('p');
        paragraph.textContent = paragraphText;
        article.append(paragraph);
      }

      if (entry.highlights?.length) {
        const heading = document.createElement('h3');
        heading.textContent = 'Notizen & Highlights';
        const list = document.createElement('ul');
        for (const text of entry.highlights) {
          const item = document.createElement('li');
          item.textContent = text;
          list.append(item);
        }
        article.append(heading, list);
      }

      if (entry.gallery?.length) {
        const gallery = document.createElement('div');
        gallery.className = 'gallery';
        for (const path of entry.gallery) {
          const image = document.createElement('img');
          image.src = path;
          image.alt = `${entry.location.name} – Reisebild`;
          image.loading = 'lazy';
          gallery.append(image);
        }
        article.append(gallery);
      }

      if (entry.links?.length) {
        const links = document.createElement('div');
        links.className = 'article-links';
        for (const link of entry.links) {
          const anchor = document.createElement('a');
          let parsedUrl;
          try { parsedUrl = new URL(link.url); } catch { continue; }
          if (parsedUrl.protocol !== 'https:' && parsedUrl.protocol !== 'http:') continue;
          anchor.href = parsedUrl.href;
          anchor.target = '_blank';
          anchor.rel = 'noopener noreferrer';
          anchor.textContent = `${link.label} ↗`;
          links.append(anchor);
        }
        article.append(links);
      }

      root.append(article);
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
    }

    document.getElementById('dialog-close').addEventListener('click', () => document.getElementById('entry-dialog').close());
    document.getElementById('entry-dialog').addEventListener('click', event => {
      if (event.target === event.currentTarget) event.currentTarget.close();
    });
    document.getElementById('search').addEventListener('input', event => {
      state.query = event.target.value.trim().toLocaleLowerCase('de-DE');
      render();
    });
    document.getElementById('filters').addEventListener('click', event => {
      const button = event.target.closest('[data-filter]');
      if (!button) return;
      state.filter = button.dataset.filter;
      for (const item of document.querySelectorAll('[data-filter]')) item.setAttribute('aria-pressed', String(item === button));
      render();
    });

    async function init() {
      try {
        const response = await fetch('./data/entries.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.data = await response.json();
        state.entries = state.data.entries.filter(entry => entry.published).sort((a, b) => a.route_order - b.route_order);
        document.documentElement.lang = state.data.trip.locale?.split('-')[0] || 'de';
        document.title = state.data.trip.title;
        document.getElementById('trip-title').textContent = state.data.trip.title;
        document.getElementById('trip-subtitle').textContent = state.data.trip.subtitle;
        const { lat, lng } = state.data.trip.home;
        map.setView([lat, lng], 6);
        render();
      } catch (error) {
        const list = document.getElementById('entry-list');
        list.replaceChildren();
        const message = document.createElement('p');
        message.className = 'error';
        message.textContent = `Die Reisedaten konnten nicht geladen werden: ${error.message}`;
        list.append(message);
      }
    }

    init();
  </script>
</body>
</html>
